name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verificar:
    name: Lint, tipos, build e políticas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Subir o Supabase local
        run: npx supabase start

      # As variáveis do ambiente local do CI saem do próprio CLI: nenhum
      # segredo de staging ou produção é necessário para verificar o código.
      - name: Exportar variáveis do ambiente local
        run: |
          npx supabase status -o env | sed 's/"//g' > .supabase-env
          . ./.supabase-env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "APP_ENV=local"
          } >> "$GITHUB_ENV"

      - name: Aplicar migrations e seed
        run: npm run db:reset

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Testes de política: leitura e escrita cruzadas entre organizações,
      # visibilidade de rascunho e escalada de privilégio. É o portão que
      # impede uma RLS mal escrita de chegar a um ambiente real.
      - run: npm test

  schema-em-dia:
    name: Schema do ambiente bate com as migrations
    runs-on: ubuntu-latest
    needs: verificar
    # Só faz sentido contra um projeto remoto de verdade.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vincular ao projeto de staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: npx supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"

      # Interrompe o deploy quando o schema remoto divergiu das migrations —
      # tipicamente porque alguém alterou algo pelo painel do Supabase, o que
      # não é uma forma válida de mudar o schema.
      - name: Conferir divergência de schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run db:diff -- --linked
